
services:
  app1:
    build: .
    container_name: app1
    env_file:
      - .env
    environment:
      MACHINE_ID: "1"
      KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8080"
    restart: unless-stopped

  app2:
    build: .
    container_name: app2
    env_file:
      - .env
    environment:
      MACHINE_ID: "2"
      KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8082:8080"
    restart: unless-stopped

  app3:
    build: .
    container_name: app3
    env_file:
      - .env
    environment:
      MACHINE_ID: "3"
      KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8083:8080"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    restart: unless-stopped
